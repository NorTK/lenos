# Restricts access to the kernel log buffer (dmesg) to root only.
# This prevents unprivileged users from viewing kernel logs, which often 
# leak memory addresses and hardware information used to craft exploits.
kernel.dmesg_restrict = 1

# Restricts the ptrace() system call to admin-only. This prevents 
# unprivileged processes from attaching to and inspecting other 
# running processes, severely limiting malware's ability to inject 
# code or dump memory.
kernel.yama.ptrace_scope = 2

# The eBPF subsystem is incredibly powerful but has been heavily
# targeted for privilege escalation. These settings disable unprivileged
# eBPF access and harden the Just-In-Time (JIT) compiler against
# heap-spraying attacks.
kernel.unprivileged_bpf_disabled = 1
net.core.bpf_jit_harden = 2

# Ensures full Address Space Layout Randomization (ASLR) is enabled.
# It randomizes the positions of the stack, VDSO page, and shared memory
# regions, making Return-Oriented Programming (ROP) attacks exceedingly
# difficult.
kernel.randomize_va_space = 2

# Network configuration, most of these are defaults but we'll add it here
# to prevent accidental modifications

# Drops packets that have strict source routing defined. Attackers use this
# to dictate the exact path a packet takes through the network, bypassing
# security controls.
net.ipv4.conf.all.accept_source_route = 0

# Ignores ICMP redirect messages. Unless this machine acts as a network router,
# it should never accept routing table updates from arbitrary hosts.
net.ipv4.conf.all.accept_redirects = 0

# Disables secure ICMP redirects (redirects from known gateways).
net.ipv4.conf.all.secure_redirects = 0

# Prevents your machine from sending ICMP redirects to other hosts.
net.ipv4.conf.all.send_redirects = 0

# Protects against SYN flood Denial-of-Service (DoS) attacks by generating
# a cryptographic cookie when the connection queue is full, allowing legitimate
# connections to complete.
net.ipv4.tcp_syncookies = 1

# Ignores ICMP echo requests sent to broadcast or multicast addresses, protecting
# your system from being used as a multiplier in Smurf attacks.
net.ipv4.icmp_echo_ignore_broadcasts = 1

# Prevents the kernel from logging warning messages when it receives invalid ICMP
# error responses, protecting against log-flooding DoS attacks.
net.ipv4.icmp_ignore_bogus_error_responses = 1

# Protects against "Time-Wait Assassination" attacks by dropping RST packets for
# sockets in the TIME_WAIT state.
net.ipv4.tcp_rfc1337 = 1

# Prevents core dumps from being created for setuid processes. If a privileged
# process crashes, you do not want its memory (which could contain passwords or
# cryptographic keys) written to the disk.
fs.suid_dumpable = 0

# Closes classic Time-of-Check to Time-of-Use (TOCTOU) vulnerabilities by restricting
# users from creating hardlinks to files they don't own, and preventing them from
# following symlinks in world-writable sticky directories (like /tmp).
fs.protected_hardlinks = 1
fs.protected_symlinks = 1



